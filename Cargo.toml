[workspace]
# Extra tooling projects will be added.
members = [
    "anchor",
    "anchor/cli",
    "anchor/client",
    "anchor/common/api_types",
    "anchor/common/bls_lagrange",
    "anchor/common/fork",
    "anchor/common/global_config",
    "anchor/common/operator_key",
    "anchor/common/qbft",
    "anchor/common/ssv_network_config",
    "anchor/common/ssv_types",
    "anchor/common/version",
    "anchor/database",
    "anchor/docgen",
    "anchor/duties_tracker",
    "anchor/eth",
    "anchor/http_api",
    "anchor/http_metrics",
    "anchor/keygen",
    "anchor/keysplit",
    "anchor/logging",
    "anchor/message_receiver",
    "anchor/message_sender",
    "anchor/message_validator",
    "anchor/network",
    "anchor/operator_doppelganger",
    "anchor/processor",
    "anchor/qbft_manager",
    "anchor/signature_collector",
    "anchor/spec_tests",
    "anchor/subnet_service",
    "anchor/validator_store",
]

resolver = "2"

[workspace.package]
edition = "2024"

# This table has three subsections: first the internal dependencies, then the lighthouse dependencies, then all other.
[workspace.dependencies]
anchor_validator_store = { path = "anchor/validator_store" }
api_types = { path = "anchor/common/api_types" }
bls_lagrange = { path = "anchor/common/bls_lagrange" }
cli = { path = "anchor/cli" }
client = { path = "anchor/client" }
database = { path = "anchor/database" }
docgen = { path = "anchor/docgen" }
duties_tracker = { path = "anchor/duties_tracker" }
eth = { path = "anchor/eth" }
fork = { path = "anchor/common/fork" }
global_config = { path = "anchor/common/global_config" }
http_api = { path = "anchor/http_api" }
http_metrics = { path = "anchor/http_metrics" }
keygen = { path = "anchor/keygen" }
keysplit = { path = "anchor/keysplit" }
logging = { path = "anchor/logging" }
message_receiver = { path = "anchor/message_receiver" }
message_sender = { path = "anchor/message_sender" }
message_validator = { path = "anchor/message_validator" }
network = { path = "anchor/network" }
operator_doppelganger = { path = "anchor/operator_doppelganger" }
operator_key = { path = "anchor/common/operator_key" }
processor = { path = "anchor/processor" }
qbft = { path = "anchor/common/qbft" }
qbft_manager = { path = "anchor/qbft_manager" }
signature_collector = { path = "anchor/signature_collector" }
ssv_network_config = { path = "anchor/common/ssv_network_config" }
ssv_types = { path = "anchor/common/ssv_types" }
subnet_service = { path = "anchor/subnet_service" }
version = { path = "anchor/common/version" }

# Lighthouse Gloas builder-API stack head, sigp/lighthouse#9807 (44f442479); re-pin to
# unstable once the #9805-#9807 stack merges
beacon_node_fallback = { git = "https://github.com/sigp/lighthouse", rev = "44f442479d628ee4dcdcbd53db04791ec368057c" }
bls = { git = "https://github.com/sigp/lighthouse", rev = "44f442479d628ee4dcdcbd53db04791ec368057c" }
builder_store = { git = "https://github.com/sigp/lighthouse", rev = "44f442479d628ee4dcdcbd53db04791ec368057c" }
builder_types = { git = "https://github.com/sigp/lighthouse", rev = "44f442479d628ee4dcdcbd53db04791ec368057c" }
eth2 = { git = "https://github.com/sigp/lighthouse", rev = "44f442479d628ee4dcdcbd53db04791ec368057c" }
eth2_keystore = { git = "https://github.com/sigp/lighthouse", rev = "44f442479d628ee4dcdcbd53db04791ec368057c" }
eth2_network_config = { git = "https://github.com/sigp/lighthouse", rev = "44f442479d628ee4dcdcbd53db04791ec368057c" }
health_metrics = { git = "https://github.com/sigp/lighthouse", rev = "44f442479d628ee4dcdcbd53db04791ec368057c" }
metrics = { git = "https://github.com/sigp/lighthouse", rev = "44f442479d628ee4dcdcbd53db04791ec368057c" }
network_utils = { git = "https://github.com/sigp/lighthouse", rev = "44f442479d628ee4dcdcbd53db04791ec368057c" }
slashing_protection = { git = "https://github.com/sigp/lighthouse", rev = "44f442479d628ee4dcdcbd53db04791ec368057c" }
slot_clock = { git = "https://github.com/sigp/lighthouse", rev = "44f442479d628ee4dcdcbd53db04791ec368057c" }
task_executor = { git = "https://github.com/sigp/lighthouse", rev = "44f442479d628ee4dcdcbd53db04791ec368057c" }
types = { git = "https://github.com/sigp/lighthouse", rev = "44f442479d628ee4dcdcbd53db04791ec368057c" }
validator_metrics = { git = "https://github.com/sigp/lighthouse", rev = "44f442479d628ee4dcdcbd53db04791ec368057c" }
validator_services = { git = "https://github.com/sigp/lighthouse", rev = "44f442479d628ee4dcdcbd53db04791ec368057c" }
validator_store = { git = "https://github.com/sigp/lighthouse", rev = "44f442479d628ee4dcdcbd53db04791ec368057c" }
workspace_members = { git = "https://github.com/sigp/lighthouse", rev = "44f442479d628ee4dcdcbd53db04791ec368057c" }

alloy = { version = "1.2.1", features = [
    "sol-types",
    "transports",
    "json",
    "contract",
    "pubsub",
    "provider-ws",
    "rpc-types",
    "rlp",
] }
arbitrary = "1.4.1"
async-channel = "1.9"
axum = "0.8.1"
base64 = "0.22.1"
blst = "0.3.14"
clap = { version = "4.5.15", features = ["derive", "wrap_help"] }
dashmap = "6.1.0"
derive_more = { version = "2.0.1", features = ["full"] }
dirs = "6.0.0"
discv5 = { version = "0.11", features = ["libp2p"] }
enr = "0.13.0"
ethereum_hashing = "0.7.0"
ethereum_ssz = "0.10.0"
ethereum_ssz_derive = "0.10.0"
futures = "0.3.30"
hex = "0.4.3"
hyper = "1.4"
indexmap = "2.7.0"
libp2p = { version = "0.57", default-features = false, features = [
    "identify",
    "yamux",
    "noise",
    "secp256k1",
    "tcp",
    "tokio",
    "macros",
    "quic",
    "ping",
    "request-response",
    "dns",
    "metrics",
    "gossipsub",
    "upnp"
] }
lru = "0.16.0"
multiaddr = "0.18.2"
num_cpus = "1"
once_cell = "1.21.3"
openssl = { version = "0.10.72", features = ["vendored"] }
parking_lot = "0.12"
pbkdf2 = "0.12.2"
prometheus-client = "0.24.0"
r2d2 = "0.8.10"
r2d2_sqlite = "0.32.0"
rand = "0.9"
reqwest = "0.12.12"
rpassword = "7.4.0"
rusqlite = { version = "0.38.0", features = ["fallible_uint"] }
safe_arith = "0.1.0"
sensitive_url = "0.1"
serde = { version = "1.0.208", features = ["derive"] }
serde_json = "1.0.140"
serde_yaml = "0.9"
sha2 = "0.10.8"
ssz_types = "0.14.0"
strum = { version = "0.27.0", features = ["derive"] }
tempfile = "3.27.0"
thiserror = "2.0.11"
tokio = { version = "1.39.2", features = [
    "rt",
    "rt-multi-thread",
    "time",
    "signal",
    "sync",
    "macros",
] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1.40"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3.18", features = ["fmt", "env-filter"] }
tree_hash = "0.12.0"
tree_hash_derive = "0.12.0"
typenum = "1.18"
unicode-normalization = "0.1.25"
zeroize = "1.8.1"

[patch.crates-io]
# Mirrors Lighthouse's own `[patch.crates-io]` at the pinned rev. Patches only take
# effect from the root workspace, so Lighthouse's copy is inert here and these must
# be kept in sync with it or the `types` crate will not compile.
# FIXME(eip-7688): EIP-7688 development patches
ssz_types = { git = "https://github.com/sigp/ssz_types", rev = "9203d56ad2d7bc5f12133d043e085843f81edcd6" }
milhouse = { git = "https://github.com/sigp/milhouse", rev = "c70f128976ac0d60ea65a978dabd117a921c36ee" }
ethereum_ssz = { git = "https://github.com/sigp/ethereum_ssz", rev = "2059c21ba52cd3a7e39a8ad537012b761812a393" }
ethereum_ssz_derive = { git = "https://github.com/sigp/ethereum_ssz", rev = "2059c21ba52cd3a7e39a8ad537012b761812a393" }
tree_hash = { git = "https://github.com/sigp/tree_hash", rev = "03d9fa474586c125f306dd7a00cf46284575a01f" }
tree_hash_derive = { git = "https://github.com/sigp/tree_hash", rev = "03d9fa474586c125f306dd7a00cf46284575a01f" }

libp2p = { git = "https://github.com/sigp/rust-libp2p.git", rev = "c774d4e71357d7cd2f792c4767d616d2dd369ee3" }
libp2p-core = { git = "https://github.com/sigp/rust-libp2p.git", rev = "c774d4e71357d7cd2f792c4767d616d2dd369ee3" }
libp2p-swarm = { git = "https://github.com/sigp/rust-libp2p.git", rev = "c774d4e71357d7cd2f792c4767d616d2dd369ee3" }
libp2p-tcp = { git = "https://github.com/sigp/rust-libp2p.git", rev = "c774d4e71357d7cd2f792c4767d616d2dd369ee3" }
libp2p-yamux = { git = "https://github.com/sigp/rust-libp2p.git", rev = "c774d4e71357d7cd2f792c4767d616d2dd369ee3" }

[profile.maxperf]
inherits = "release"

codegen-units = 1
incremental = false
lto = "fat"
