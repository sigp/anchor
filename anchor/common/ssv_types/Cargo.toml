[package]
name = "ssv_types"
version = "0.1.0"
edition = { workspace = true }
authors = ["Sigma Prime <contact@sigmaprime.io>"]

[features]
arbitrary-fuzz = ["arbitrary"]

[dependencies]
arbitrary = { workspace = true, optional = true }
base64 = { workspace = true }
bls = { workspace = true }
derive_more = { workspace = true }
# The "events" feature is required for independent crate compilation (e.g. `cargo test -p subnet_service`).
# Without it, eth2's Error::status() references an SseEventSource variant that is gated behind
# this feature. In full workspace builds beacon_node_fallback enables it via feature unification.
eth2 = { workspace = true, features = ["events"] }
ethereum_ssz = { workspace = true }
ethereum_ssz_derive = { workspace = true }
hex = { workspace = true }
indexmap = { workspace = true }
openssl = { workspace = true }
operator_key = { workspace = true }
rusqlite = { workspace = true }
sha2 = { workspace = true }
slashing_protection = { workspace = true }
ssz_types = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tree_hash = { workspace = true }
tree_hash_derive = { workspace = true }
typenum = { workspace = true }
types = { workspace = true }

[dev-dependencies]
strum = { workspace = true }
tempfile = { workspace = true }
